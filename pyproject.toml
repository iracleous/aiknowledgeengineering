[project]
name = "dataapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dimitris Iracleous", email = "iracleous@gmail.com" }
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "chainlit>=2.12.0",
    "chromadb>=1.5.9",
    "databricks-connect>=16.3.1",
    "databricks-sql-connector>=4.6.0",
    "deepagents>=0.7.20",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.4",
    "langchain-neo4j>=0.11.0",
    "langchain-openai>=1.6.5",
    "langgraph>=1.2.12",
    "matplotlib>=3.11.2",
    "networkx>=3.6.1",
    "owlrl>=7.6.2",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rdflib>=7.6.0",
    "requests>=2.34.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
dataapi = "dataapi:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
